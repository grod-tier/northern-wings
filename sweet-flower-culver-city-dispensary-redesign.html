<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Flower Culver City — The Original Culver City Dispensary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap');

  :root {
    --ink: oklch(24% 0.04 240);
    --ink-deep: oklch(18% 0.05 245);
    --cream: oklch(96% 0.02 85);
    --cream-warm: oklch(92% 0.04 78);
    --bloom: oklch(82% 0.15 85);
    --bloom-deep: oklch(72% 0.17 70);
    --sage: oklch(62% 0.09 155);
    --sage-deep: oklch(42% 0.07 160);
    --rose: oklch(68% 0.14 25);
    --line: oklch(24% 0.04 240 / 0.15);

    --display: 'Fraunces', serif;
    --body: 'Outfit', system-ui, sans-serif;

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .container { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 24px; }

  /* NAV */
  header.site {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 20px 0;
    backdrop-filter: blur(14px);
    background: oklch(96% 0.02 85 / 0.78);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1360px; margin: 0 auto; padding: 0 24px;
  }
  .brand {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: -0.03em;
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--bloom), var(--bloom-deep));
    position: relative;
  }
  .brand-mark::after {
    content: ''; position: absolute; left: 50%; top: 100%;
    width: 1.5px; height: 12px; background: var(--sage-deep);
    transform: translateX(-50%);
  }
  .brand em { font-style: italic; color: var(--sage-deep); }

  nav ul {
    display: flex; list-style: none; gap: 36px;
    font-size: 0.92rem; font-weight: 400;
  }
  nav a { position: relative; transition: color 0.3s var(--ease); }
  nav a::after {
    content: ''; position: absolute; left: 0; bottom: -4px;
    width: 0; height: 1px; background: var(--ink);
    transition: width 0.4s var(--ease);
  }
  nav a:hover::after { width: 100%; }

  .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px;
    background: var(--ink); color: var(--cream);
    font-size: 0.88rem; font-weight: 500;
    transition: all 0.4s var(--ease);
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px oklch(24% 0.04 240 / 0.25); }

  /* HERO */
  .hero {
    min-height: 100vh;
    padding: 140px 0 80px;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 64px;
    align-items: end;
    min-height: 80vh;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--sage-deep); font-weight: 500;
    margin-bottom: 32px;
    animation: fadeUp 0.9s var(--ease) both;
  }
  .eyebrow::before {
    content: ''; width: 24px; height: 1px; background: var(--sage-deep);
  }
  h1.display {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(3rem, 7vw, 6.5rem);
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: var(--ink-deep);
    margin-bottom: 32px;
  }
  h1.display span {
    font-style: italic;
    color: var(--sage-deep);
    font-weight: 300;
  }
  h1.display .seed {
    display: inline-block;
    position: relative;
  }
  h1.display .seed::after {
    content: ''; position: absolute;
    right: -8px; top: 18%;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bloom);
  }
  .hero-lead {
    font-size: 1.125rem;
    max-width: 52ch;
    color: oklch(35% 0.04 240);
    margin-bottom: 40px;
    animation: fadeUp 0.9s 0.2s var(--ease) both;
  }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; animation: fadeUp 0.9s 0.3s var(--ease) both; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; border-radius: 999px;
    font-weight: 500; font-size: 0.95rem;
    transition: all 0.4s var(--ease);
    border: 1px solid transparent;
  }
  .btn-primary {
    background: var(--ink); color: var(--cream);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px oklch(24% 0.04 240 / 0.3); }
  .btn-ghost {
    border-color: var(--ink); color: var(--ink);
  }
  .btn-ghost:hover { background: var(--ink); color: var(--cream); transform: translateY(-2px); }

  /* Hero image */
  .hero-visual {
    position: relative;
    aspect-ratio: 4/5;
    animation: fadeUp 1s 0.4s var(--ease) both;
  }
  .hero-visual img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 260px 260px 24px 24px;
    filter: saturate(1.05);
  }
  .hero-badge {
    position: absolute;
    bottom: -24px; left: -24px;
    background: var(--cream);
    padding: 20px 24px;
    border-radius: 20px;
    box-shadow: 0 20px 50px oklch(24% 0.04 240 / 0.15);
    font-size: 0.85rem;
    max-width: 220px;
  }
  .hero-badge strong { font-family: var(--display); font-size: 1.5rem; font-weight: 500; display: block; margin-bottom: 4px; letter-spacing: -0.02em; }
  .hero-badge span { color: var(--sage-deep); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; }

  .hero-meta {
    position: absolute;
    top: 140px; right: 24px;
    display: flex; flex-direction: column; gap: 14px;
    font-size: 0.82rem;
    text-align: right;
    animation: fadeUp 0.9s 0.5s var(--ease) both;
  }
  .hero-meta div b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.05rem; letter-spacing: -0.02em; margin-bottom: 2px; }
  .hero-meta div span { color: oklch(45% 0.03 240); }

  /* Decorative circle */
  .hero::before {
    content: '';
    position: absolute;
    top: 20%; left: -120px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, var(--bloom) 0%, transparent 70%);
    opacity: 0.5;
    border-radius: 50%;
    pointer-events: none;
  }

  /* MARQUEE */
  .marquee {
    background: var(--ink);
    color: var(--cream);
    padding: 28px 0;
    overflow: hidden;
    border-top: 1px solid oklch(28% 0.04 240);
    border-bottom: 1px solid oklch(28% 0.04 240);
  }
  .marquee-track {
    display: flex; gap: 64px;
    white-space: nowrap;
    animation: scroll 38s linear infinite;
    font-family: var(--display);
    font-size: 1.75rem;
    font-weight: 300;
    letter-spacing: -0.02em;
  }
  .marquee-track span { display: flex; align-items: center; gap: 64px; }
  .marquee-track em { color: var(--bloom); font-style: italic; }
  .marquee-track .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bloom); display: inline-block; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  /* ABOUT */
  .about {
    padding: 140px 0;
    position: relative;
  }
  .about-grid {
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 96px;
    align-items: start;
  }
  .section-label {
    font-family: var(--display);
    font-size: 0.95rem;
    font-style: italic;
    color: var(--sage-deep);
    margin-bottom: 16px;
  }
  h2.section {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.25rem, 4.5vw, 3.75rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--ink-deep);
  }
  h2.section em { color: var(--sage-deep); font-weight: 300; }

  .about-text p {
    font-size: 1.06rem;
    color: oklch(35% 0.04 240);
    margin-bottom: 24px;
    max-width: 58ch;
  }
  .about-sig {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family: var(--display);
    font-style: italic;
    font-size: 1.25rem;
    color: var(--ink);
  }
  .about-sig small { display: block; font-family: var(--body); font-style: normal; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage-deep); margin-top: 6px; }

  /* PRODUCTS */
  .products {
    padding: 120px 0;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 100%);
  }
  .products-head {
    display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 24px;
    margin-bottom: 72px;
  }
  .products-head p { max-width: 40ch; color: oklch(35% 0.04 240); }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .product-card {
    position: relative;
    background: var(--cream);
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
    cursor: pointer;
  }
  .product-card:hover { transform: translateY(-6px); box-shadow: 0 30px 60px oklch(24% 0.04 240 / 0.12); }
  .product-card:nth-child(2) { margin-top: 48px; }
  .product-card:nth-child(4) { margin-top: 48px; }

  .product-img {
    aspect-ratio: 3/4;
    overflow: hidden;
    background: oklch(88% 0.03 85);
  }
  .product-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.8s var(--ease);
  }
  .product-card:hover .product-img img { transform: scale(1.06); }

  .product-info { padding: 20px 20px 24px; }
  .product-info h3 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.35rem;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .product-info small { color: var(--sage-deep); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }

  .product-tag {
    position: absolute; top: 16px; left: 16px;
    background: var(--cream);
    padding: 6px 12px; border-radius: 999px;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* TESTIMONIALS */
  .proof {
    padding: 140px 0;
    background: var(--ink-deep);
    color: var(--cream);
    position: relative;
    overflow: hidden;
  }
  .proof::before {
    content: '';
    position: absolute; right: -200px; top: -100px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, var(--sage-deep) 0%, transparent 70%);
    opacity: 0.35;
  }
  .proof-head { text-align: center; margin-bottom: 80px; position: relative; }
  .proof-head .section-label { color: var(--bloom); }
  .proof-head h2 { color: var(--cream); max-width: 16ch; margin: 0 auto; }

  .testimonials {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    position: relative;
  }
  .testimonial {
    background: oklch(22% 0.04 245);
    padding: 40px 32px;
    border-radius: 20px;
    border: 1px solid oklch(30% 0.04 240);
    transition: transform 0.5s var(--ease);
  }
  .testimonial:hover { transform: translateY(-4px); border-color: var(--bloom); }
  .stars { color: var(--bloom); margin-bottom: 20px; letter-spacing: 2px; }
  .testimonial blockquote {
    font-family: var(--display);
    font-size: 1.2rem;
    line-height: 1.4;
    letter-spacing: -0.015em;
    margin-bottom: 28px;
  }
  .t-author { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; }
  .t-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--bloom);
    font-family: var(--display);
    display: grid; place-items: center;
    color: var(--ink); font-weight: 500;
  }
  .t-author small { display: block; color: oklch(70% 0.02 240); font-size: 0.78rem; }

  /* FAQ */
  .faq { padding: 140px 0; }
  .faq-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap: 80px;
    align-items: start;
  }
  .faq-list { display: flex; flex-direction: column; }
  details {
    border-top: 1px solid var(--line);
    padding: 24px 0;
    transition: all 0.3s var(--ease);
  }
  details:last-child { border-bottom: 1px solid var(--line); }
  summary {
    cursor: pointer; list-style: none;
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
    font-family: var(--display);
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    transition: color 0.3s;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--sage-deep); }
  summary::after {
    content: '+';
    font-family: var(--body);
    font-weight: 300;
    font-size: 1.6rem;
    transition: transform 0.3s;
  }
  details[open] summary::after { transform: rotate(45deg); }
  details p {
    margin-top: 16px;
    color: oklch(40% 0.04 240);
    max-width: 62ch;
  }

  /* CTA FOOTER */
  .cta-footer {
    background: var(--sage-deep);
    color: var(--cream);
    padding: 140px 0 40px;
    position: relative;
    overflow: hidden;
  }
  .cta-footer::before {
    content: '';
    position: absolute; top: -150px; left: 50%;
    width: 600px; height: 600px;
    transform: translateX(-50%);
    background: radial-gradient(circle, var(--bloom) 0%, transparent 60%);
    opacity: 0.25;
    border-radius: 50%;
  }
  .cta-main {
    text-align: center;
    max-width: 900px;
    margin: 0 auto 120px;
    position: relative;
  }
  .cta-main h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 5rem);
    line-height: 1;
    letter-spacing: -0.035em;
    margin-bottom: 32px;
  }
  .cta-main h2 em { font-style: italic; color: var(--bloom); }
  .cta-main p { font-size: 1.15rem; margin-bottom: 40px; opacity: 0.85; }
  .btn-bloom {
    background: var(--bloom); color: var(--ink);
  }
  .btn-bloom:hover { background: var(--cream); transform: translateY(-2px); }

  .footer-info {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr;
    gap: 48px;
    padding-top: 60px;
    border-top: 1px solid oklch(52% 0.07 160);
    position: relative;
  }
  .footer-info h4 {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: 1rem;
    margin-bottom: 16px;
    color: var(--bloom);
  }
  .footer-info ul { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 0.92rem; opacity: 0.88; }
  .footer-info ul a:hover { color: var(--bloom); }
  .footer-info address { font-style: normal; font-size: 0.92rem; line-height: 1.7; opacity: 0.88; }
  .footer-info .brand { color: var(--cream); }

  .footer-bottom {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid oklch(52% 0.07 160);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    font-size: 0.82rem; opacity: 0.7;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal { opacity: 0; transform: translateY(30px); transition: all 1s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* RESPONSIVE */
  @media (max-width: 960px) {
    nav ul, .hero-meta { display: none; }
    .hero-grid, .about-grid, .faq-grid { grid-template-columns: 1fr; gap: 48px; }
    .product-grid { grid-template-columns: repeat(2, 1fr); }
    .product-card:nth-child(2), .product-card:nth-child(4) { margin-top: 0; }
    .testimonials { grid-template-columns: 1fr; }
    .footer-info { grid-template-columns: 1fr 1fr; }
    .about { padding: 80px 0; }
    .hero { padding: 120px 0 60px; }
  }
  @media (max-width: 520px) {
    .product-grid { grid-template-columns: 1fr; }
    .footer-info { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav">
    <a href="#" class="brand">
      <span class="brand-mark"></span>
      Sweet<em>Flower</em>
    </a>
    <nav>
      <ul>
        <li><a href="#shop">Shop</a></li>
        <li><a href="#brands">Brands</a></li>
        <li><a href="#about">Dispensary</a></li>
        <li><a href="#delivery">Delivery</a></li>
        <li><a href="#rewards">Sweet Rewards</a></li>
        <li><a href="#deals">Daily Deals</a></li>
      </ul>
    </nav>
    <a href="#shop" class="nav-cta">
      Shop Menu
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <div class="hero-meta">
      <div><b>8AM — 10PM</b><span>Open daily</span></div>
      <div><b>10000 Culver Blvd</b><span>Culver City, CA 90232</span></div>
      <div><b>(310) 730-6337</b><span>Call or text</span></div>
    </div>

    <div class="hero-grid">
      <div class="hero-copy">
        <div class="eyebrow">Culver City's Original Dispensary ·
