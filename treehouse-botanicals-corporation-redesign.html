<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treehouse Los Angeles — Neighborhood Cannabis Dispensary on Venice Blvd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: oklch(28% 0.04 150);
    --forest-deep: oklch(20% 0.035 155);
    --moss: oklch(45% 0.08 140);
    --cream: oklch(96% 0.025 90);
    --cream-warm: oklch(93% 0.04 85);
    --ember: oklch(68% 0.17 55);
    --ember-soft: oklch(78% 0.11 60);
    --ink: oklch(18% 0.02 150);
    --fog: oklch(88% 0.015 150);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --s-1: 8px; --s-2: 16px; --s-3: 24px; --s-4: 32px;
    --s-5: 48px; --s-6: 64px; --s-7: 96px; --s-8: 128px;

    --display: 'Fraunces', Georgia, serif;
    --body: 'Inter Tight', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    background: var(--cream);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }

  .container {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 var(--s-3);
  }

  /* ========= NAV ========= */
  header.site {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: var(--s-3) 0;
    background: color-mix(in oklch, var(--cream) 85%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid color-mix(in oklch, var(--forest) 10%, transparent);
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--s-4);
  }
  .logo {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.5rem;
    letter-spacing: -0.03em;
    color: var(--forest);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo svg { width: 26px; height: 26px; }
  .nav-links {
    display: flex;
    gap: var(--s-4);
    list-style: none;
    font-size: 0.94rem;
    font-weight: 500;
  }
  .nav-links a {
    position: relative;
    padding: 6px 2px;
    color: var(--forest);
    transition: color 0.3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--ember);
    transition: width 0.4s var(--ease-out);
  }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    background: var(--forest);
    color: var(--cream);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: transform 0.3s var(--ease-out), background 0.3s;
  }
  .nav-cta:hover {
    transform: translateY(-2px);
    background: var(--forest-deep);
    box-shadow: 0 10px 24px -10px oklch(28% 0.04 150 / 0.4);
  }
  @media (max-width: 820px) {
    .nav-links { display: none; }
  }

  /* ========= HERO ========= */
  .hero {
    padding: calc(var(--s-8) + var(--s-4)) 0 var(--s-7);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -10%; right: -15%;
    width: 720px; height: 720px;
    background: radial-gradient(circle at center, oklch(68% 0.17 55 / 0.18), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: var(--s-6);
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--moss);
    margin-bottom: var(--s-3);
  }
  .eyebrow .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 0 4px oklch(68% 0.17 55 / 0.2);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px oklch(68% 0.17 55 / 0.2); }
    50% { box-shadow: 0 0 0 8px oklch(68% 0.17 55 / 0.05); }
  }
  .hero h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(3rem, 7.2vw, 6.4rem);
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: var(--forest-deep);
    margin-bottom: var(--s-4);
  }
  .hero h1 em {
    font-style: italic;
    font-variation-settings: "SOFT" 100;
    color: var(--moss);
  }
  .hero h1 .accent {
    display: inline-block;
    position: relative;
  }
  .hero h1 .accent::after {
    content: '';
    position: absolute;
    left: -4%; right: -4%; bottom: 6%;
    height: 22%;
    background: var(--ember-soft);
    z-index: -1;
    border-radius: 4px;
    transform: skewX(-6deg);
  }
  .hero p.lede {
    font-size: 1.15rem;
    max-width: 52ch;
    color: color-mix(in oklch, var(--ink) 78%, transparent);
    margin-bottom: var(--s-5);
  }
  .hero-actions {
    display: flex;
    gap: var(--s-2);
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 30px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 0.98rem;
    letter-spacing: 0.01em;
    transition: transform 0.35s var(--ease-out), box-shadow 0.35s, background 0.3s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--forest);
    color: var(--cream);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    background: var(--forest-deep);
    box-shadow: 0 18px 36px -14px oklch(28% 0.04 150 / 0.45);
  }
  .btn-primary svg { transition: transform 0.35s var(--ease-out); }
  .btn-primary:hover svg { transform: translateX(4px); }
  .btn-ghost {
    background: transparent;
    color: var(--forest);
    border: 1px solid color-mix(in oklch, var(--forest) 30%, transparent);
  }
  .btn-ghost:hover {
    transform: translateY(-2px);
    background: color-mix(in oklch, var(--forest) 6%, transparent);
    border-color: var(--forest);
  }

  .hero-visual {
    position: relative;
    aspect-ratio: 4 / 5;
  }
  .hero-visual .frame {
    position: absolute;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 60px -30px oklch(28% 0.04 150 / 0.35);
  }
  .hero-visual .frame img { width: 100%; height: 100%; object-fit: cover; }
  .frame-main {
    top: 0; right: 0;
    width: 78%; height: 82%;
    border-radius: 280px 280px 24px 24px;
  }
  .frame-sub {
    bottom: 0; left: 0;
    width: 46%; height: 38%;
    border-radius: 24px;
    border: 8px solid var(--cream);
  }
  .floating-card {
    position: absolute;
    bottom: 18%; right: -6%;
    background: var(--cream);
    padding: 18px 22px;
    border-radius: 16px;
    box-shadow: 0 20px 40px -18px oklch(28% 0.04 150 / 0.3);
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.88rem;
  }
  .floating-card .ring {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: conic-gradient(var(--ember) 0 72%, var(--fog) 72% 100%);
    display: grid;
    place-items: center;
    position: relative;
  }
  .floating-card .ring::before {
    content: '';
    width: 30px; height: 30px;
    background: var(--cream);
    border-radius: 50%;
    position: absolute;
  }
  .floating-card .ring span {
    position: relative;
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--forest);
  }
  .floating-card strong {
    font-family: var(--display);
    font-weight: 500;
    color: var(--forest);
    display: block;
    font-size: 1rem;
    letter-spacing: -0.01em;
  }
  .floating-card em {
    font-style: normal;
    color: var(--moss);
    font-size: 0.8rem;
  }

  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-visual { max-width: 500px; margin: 0 auto; width: 100%; }
    .floating-card { right: 4%; }
  }

  /* ========= MARQUEE STRIP ========= */
  .strip {
    background: var(--forest-deep);
    color: var(--cream-warm);
    padding: var(--s-4) 0;
    overflow: hidden;
    border-top: 1px solid oklch(35% 0.05 150);
    border-bottom: 1px solid oklch(35% 0.05 150);
  }
  .marquee {
    display: flex;
    gap: var(--s-6);
    animation: scroll 40s linear infinite;
    white-space: nowrap;
    font-family: var(--display);
    font-size: 1.4rem;
    letter-spacing: -0.01em;
  }
  .marquee span {
    display: flex;
    align-items: center;
    gap: var(--s-6);
  }
  .marquee span::after {
    content: '✦';
    color: var(--ember);
    font-size: 0.9rem;
  }
  @keyframes scroll {
    to { transform: translateX(-50%); }
  }

  /* ========= CATEGORIES ========= */
  .shop {
    padding: var(--s-8) 0;
  }
  .section-head {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: var(--s-5);
    align-items: end;
    margin-bottom: var(--s-6);
  }
  .section-head h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.2rem, 4.6vw, 3.8rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--forest-deep);
  }
  .section-head h2 em {
    font-style: italic;
    color: var(--moss);
  }
  .section-head p {
    font-size: 1.02rem;
    color: color-mix(in oklch, var(--ink) 70%, transparent);
    max-width: 46ch;
  }
  @media (max-width: 820px) {
    .section-head { grid-template-columns: 1fr; }
  }

  .categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--s-3);
  }
  .cat-card {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    background: var(--forest);
    cursor: pointer;
    transition: transform 0.5s var(--ease-out);
  }
  .cat-card:hover { transform: translateY(-6px); }
  .cat-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.8s var(--ease-out);
    filter: saturate(0.95);
  }
  .cat-card:hover img { transform: scale(1.08); }
  .cat-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, oklch(20% 0.035 155 / 0.85) 0%, transparent 55%);
  }
  .cat-card .meta {
    position: absolute;
    left: 20px; right: 20px; bottom: 20px;
    color: var(--cream);
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 10px;
  }
  .cat-card h3 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
  }
  .cat-card .count {
    font-size: 0.78rem;
    opacity: 0.75;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .cat-card .arrow {
    width: 36px; height: 36px;
    background: var(--cream);
    color: var(--forest);
    border-radius: 50%;
    display: grid;
    place-items: center;
    transition: transform 0.3s var(--ease-out);
  }
  .cat-card:hover .arrow { transform: rotate(-45deg); }

  @media (max-width: 960px) { .categories { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .categories { grid-template-columns: 1fr; } }

  /* ========= ABOUT SPLIT ========= */
  .about {
    background: var(--forest-deep);
    color: var(--cream-warm);
    padding: var(--s-8) 0;
    position: relative;
    overflow: hidden;
  }
  .about::before {
    content: '';
    position: absolute;
    top: 10%; left: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, oklch(68% 0.17 55 / 0.12), transparent 65%);
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: var(--s-6);
    align-items: center;
    position: relative;
  }
  .about-visual {
    position: relative;
    aspect-ratio: 1;
  }
  .about-visual img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50% 50% 24px 24px / 40% 40% 24px 24px;
  }
  .about-visual::before {
    content: '';
    position: absolute;
    inset: -20px;
    border: 1px dashed oklch(68% 0.17 55 / 0.4);
    border-radius: 50% 50% 32px 32px / 44% 44% 32px 32px;
  }
  .about h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.2rem, 4.6vw, 3.8rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: var(--cream);
    margin-bottom: var(--s-3);
  }
  .about h2 em { font-style: italic; color: var(--ember-soft); }
  .about p {
    font-size: 1.05rem;
    opacity: 0.82;
    max-width: 56ch;
    margin-bottom: var(--s-4);
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-3);
    margin-top: var(--s-5);
    padding-top: var(--s-4);
    border-top: 1px solid oklch(60% 0.05 150 / 0.2);
  }
  .stat .num {
    font-family: var(--display);
    font-size: 2.4rem;
    font-weight: 400;
    color: var(--ember-soft);
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .stat .label {
    font-size: 0.82rem;
    opacity: 0.7;
    margin-top: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  @media (max-width: 820px) {
    .about-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(3, 1fr); }
  }

  /* ========= TESTIMONIALS ========= */
  .voices {
    padding: var(--s-8) 0;
    background: var(--cream);
  }
  .quotes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--s-3);
    margin-top: var(--s-5);
  }
  .quote {
    background: var(--cream-warm);
    padding: var(--s-4);
    border-radius: 20px;
    border: 1px solid color-mix(in oklch, var(--forest) 8%, transparent);
    position: relative;
    transition: transform 0.4s var(--ease-out), box-shadow 0.4s;
  }
  .quote:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 48px -24px oklch(28% 0.04 150 / 0.25);
  }
  .quote:nth-child(2) {
    background: var(--forest);
    color: var(--cream-warm);
    border-color: transparent;
    transform: translateY(-24px);
  }
  .quote:nth-child(2):hover { transform: translateY(-28px); }
  .stars {
    color: var(--ember);
    font-size: 0.9rem;
    letter-spacing: 3px;
    margin-bottom: var(--s-2);
  }
  .quote p {
    font-family: var(--display);
    font-size: 1.18rem;
    line-height: 1.4;
    letter-spacing: -0.015em;
    margin-bottom: var(--s-3);
  }
  .quote .who {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.88rem;
  }
  .quote .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--moss);
    overflow: hidden;
  }
  .quote .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .quote .name { font-weight: 500; }
  .quote .loc { opacity: 0.6; font-size: 0.8rem; }
  @media (max-width: 900px) {
    .quotes { grid-template-columns: 1fr; }
    .quote:nth-child(2) { transform: none; }
    .quote:nth-child(2):hover { transform: translateY(-4px); }
  }

  /* ========= VISIT CTA ========= */
  .visit {
    padding: var(--s-8) 0;
    background: var(--cream);
  }
  .visit-card {
    background: var(--forest-deep);
    color: var(--cream);
    border-radius: 28px;
    padding: var(--s-7) var(--s-6);
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: var(--s-5);
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .visit-card::before {
    content: '';
    position: absolute;
    right: -80px; bottom: -80px;
    width: 380px; height: 380px;
    background: radial-gradient(circle, oklch(68% 0.17 55 / 0.25), transparent 65%);
  }
  .visit h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.2rem, 4.6vw, 4rem);
    line-height: 1;
    letter-spacing: -0.035em;
    margin-bottom: var(--s-3);
  }
  .visit h2 em { font-style: italic; color: var(--ember-soft); }
  .visit p { opacity: 0.8; margin-bottom: var(--s-4); max-width: 48ch; }
  .visit-info {
    position: relative;
    background: oklch(25% 0.04 150);
    border-radius: 20px;
    padding: var(--s-4);
    font-size: 0.95rem;
  }
  .info-row {
    display: flex;
    gap: var(--s-2);
    padding: 14px 0;
    border-bottom: 1px solid oklch(60% 0.05 150 / 0.15);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row svg { flex-shrink: 0; margin-top: 2px; color: var(--ember-soft); }
  .info-row strong {
    display: block;
    font-family: var(--display);
    font-weight: 500;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ember-soft);
    margin-bottom: 4px;
  }
  @media (max-width: 820px) {
    .visit-card { grid-template-columns: 1fr; padding: var(--s-5) var(--s-4); }
  }

  /* ========= FOOTER ========= */
  footer {
    background: var(--forest-deep);
    color: var(--cream-
